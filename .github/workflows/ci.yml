name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version's result; one failure shouldn't cancel the others and
      # hide whether the problem is version-specific.
      fail-fast: false
      matrix:
        # The floor is the `engines` floor: node:sqlite arrives in 22.5.0.
        node-version: ['22', '24', '26']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # No build step: the default suite runs against lib/ sources, transformed
      # in-process.
      - run: npm test

      # Builds, packs, and exercises the tarball. Matrixed alongside the default suite
      # because it is the only thing that runs the *emitted* dist/, and the published
      # package has to work on the engines floor, not just on the newest Node.
      - run: npm run test:packaged

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # biome check + tsc --noEmit. Version-independent, so it runs once rather than
      # once per matrix entry.
      - run: npm run lint

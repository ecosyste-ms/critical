name: Build and Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check_release.outputs.exists }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Packs the tarball and exercises what it ships: entrypoint, exports and bin.
      - run: npm run test:packaged

      # The database build, which `npm run build` used to be before it became `tsc`.
      - run: npm run build:db

      - name: Get version
        id: version
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${MAJOR_MINOR}.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "tag=v${MAJOR_MINOR}.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Compress database
        run: gzip -k critical-packages.db

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database
          path: |
            critical-packages.db
            critical-packages.db.gz

      - name: Check if release exists
        id: check_release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            critical-packages.db
            critical-packages.db.gz
          body: |
            Daily build of critical packages database.

            Download the `.db` file for uncompressed SQLite, or `.db.gz` for compressed.

            Also available via npm: `npm install @ecosyste-ms/critical@${{ steps.version.outputs.version }}`

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: database

      # Trusted publishing needs npm >= 11.5.1. Pinned rather than @latest so an
      # untested npm release cannot silently change publish behaviour on a
      # pipeline that runs daily and unattended.
      - name: Install npm
        run: npm install -g npm@12.0.2

      # prepublishOnly runs tsc, and dist/ is not committed, so this job needs the
      # devDependencies installed before it can publish at all.
      - run: npm ci

      - name: Set package version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@ecosyste-ms/critical@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published, skipping"
          else
            npm publish --access public
          fi
